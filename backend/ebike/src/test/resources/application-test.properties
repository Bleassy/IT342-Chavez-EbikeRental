# Test Database Configuration (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration for Testing
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Server Configuration
server.port=0

# Logging - Keep minimal during tests
logging.level.root=WARN
logging.level.com.ebike.rental=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.boot.web=WARN

# Security
spring.security.user.name=admin
spring.security.user.password=admin

# JWT Configuration
app.jwt.secret=test-secret-key-for-testing-purposes-only
app.jwt.expiration=3600000

# Payment Configuration (Test Mode)
stripe.api.key=sk_test_mock_key_for_testing
stripe.webhook.secret=whsec_test_mock_key_for_testing
gcash.api.url=https://test.mock.gcash.api

# Connection Pool
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# Test Data
spring.sql.init.mode=always
spring.sql.init.platform=h2
