plugins {
    id 'com.android.application' version '8.2.0' apply false
    id 'com.android.library' version '8.2.0' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
}

def externalBuildDir = new File(System.getProperty('user.home'), '.ebikemobile-build')
rootProject.buildDir = externalBuildDir

subprojects {
    buildDir = new File(externalBuildDir, project.name)
}

task clean(type: Delete) {
    delete externalBuildDir
}
